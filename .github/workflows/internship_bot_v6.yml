name: Internship Bot v7.0

on:
  schedule:
    # Daily at 8:00 AM IST (2:30 AM UTC). Daily so tracker reminders land on time.
    # Monday runs also send the weekly full-time digest.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force_fulltime_digest:
        description: "Send the full-time digest now"
        type: boolean
        default: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Internship Bot
        run: python internship_bot_v7.py
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          # EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FORCE_FULLTIME_DIGEST: ${{ inputs.force_fulltime_digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: internships-${{ github.run_number }}
          path: internships.xlsx
          if-no-files-found: ignore
